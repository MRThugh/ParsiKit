[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parsikit"
version = "2.8.0"
authors = [
    { name = "Ali Kamrani", email = "kamrani.exe@gmail.com" }
]
description = "A comprehensive, pure Python library for Persian text processing, validation, financial calculations, calendar conversions, and text reshaping."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "persian", "standardize", "reshaper", "shamsi", "jalali", 
    "validator", "bank-card", "sheba", "billing", "national-code", 
    "postal-code", "plate-validator", "loan-calculator"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Persian",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[tool.setuptools]
packages = ["parsikit"]

[project.urls]
"Homepage" = "https://github.com/MRThugh/ParsiKit"
"Bug Tracker" = "https://github.com/MRThugh/ParsiKit/issues"